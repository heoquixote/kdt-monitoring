name: daily-collect
on:
  schedule: [{ cron: "0 21 * * *" }]   # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: daily-collect, cancel-in-progress: false }

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORK24_API_KEY: ${{ secrets.WORK24_API_KEY }}
      WORK24_CODE_KEY: ${{ secrets.WORK24_CODE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Collect from 고용24
        run: python -m app.collector
      - name: Export courses
        run: python scripts/export_courses.py
      # 일별 스냅샷 이력이 다음 실행으로 이어지도록 DB와 내보낸 JSON을 커밋한다.
      - name: Commit data
        run: |
          git config user.name "kdt-bot"
          git config user.email "kdt-bot@users.noreply.github.com"
          git add data/kdt.db data/courses_live.json
          git diff --cached --quiet || git commit -m "data: daily collect $(date -u +%F)"
          git push
